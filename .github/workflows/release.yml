name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-plugin-versions.sh "${GITHUB_REF_NAME}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --notes "Software factory ${GITHUB_REF_NAME}."
      - env:
          XAI_MARKETPLACE_TOKEN: ${{ secrets.XAI_MARKETPLACE_TOKEN }}
        run: bash scripts/ship-grok-catalog.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
