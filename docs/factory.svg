<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title">
<title id="title">Software factory</title>
<desc>You classify. CTO tickets. Telemetry is a vendor plug. Bug, Feature, Docs implement. Review. CI. You merge. Runner is a plug: Grok, Claude, Codex, Cursor.</desc>
